<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.0.0/animate.min.css" />
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" type="image/x-icon" href="./img/hbd.png">
  <title>Happy Birthday Syifa</title>
</head>

<body>
  <audio id="background-music" src="./music/monokrom.mp3" preload="auto">
  </audio>

  <div class="bg" id="content">

    <div class="container" id="timer">
      <h5>Countdown to <x id='name'></x> birthday :</h5>
      <ul>
        <li><span id="days"></span>days</li>
        <li><span id="hours"></span>Hours</li>
        <li><span id="minutes"></span>Minutes</li>
        <li><span id="seconds"></span>Seconds</li>
      </ul>
    </div>

    <div id="slideSatu" class="animate__animated animate__slideInDown animate__slow d-none">
      <img src="./img/hbd1.png" class="img">
    </div>

    <div id="slideDua"
      class="slides d-none paper animate__zoomInDown animate__animated animate__delay-2s animate__slow">
      <div class="paper-content">
        <p id="teks1" class="teks"></p>
      </div>
    </div>

    <div id="slideTiga" class="slides d-none paper animate__fadeInRight animate__animated">
      <div class="paper-content">
        <p id="teks2" class="teks"></p>
      </div>
    </div>

    <div class="kotak d-none slides animate__animated animate__fadeInDown animate__delay-2s" id="slideEmpat">
      <div class="row">
        <div class="col-sm mt-1">
          <h5>Kamu suka nggak?</h5>
        </div>
      </div>
      <div class="row mt-2">
        <div class="col-4 offset-2">
          <button id="gak" class="btn btn-outline-danger"> Gak! </button>
        </div>
        <div class="col-4">
          <button id="suka" class="btn btn-outline-info"> Suka!! </button>
        </div>
      </div>
    </div>

    <div id="slideLima" class="d-none animate__bounceIn animate__animated animate__slow">
      <i class="fas fa-heart fa-5x text-danger"></i>
    </div>
    <p id="trims" class="text-muted d-none mt-2"></p>
   
<!-- Slide Amplop Putih Interaktif -->
<div id="slideFoto" class="d-none animate__animated animate__fadeIn container" style="position: relative; margin-top: 50px; z-index: 99999; text-align: center;">
  
  <!-- Amplop Putih Realistis -->
  <div id="envelope-wrapper" class="real-envelope" onclick="nextPhotoStep()">
    <div class="envelope-flap"></div>
    <div class="envelope-body"></div>
    <div class="heart-seal">❤️</div>
  </div>

  <!-- Wadah Foto Interaktif -->
<div id="photo-display-container" style="display: none; justify-content: center; align-items: center; position: relative; top: -30px;">
  <div id="photo-card-wrapper" style="background: white; padding: 16px 16px 45px 16px; border-radius: 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.25); transform: scale(0.5); opacity: 0; transition: all 0.4s ease; cursor: pointer; display: inline-block;" onclick="nextPhotoStep()">
    <img id="current-memory-photo" src="" alt="Kenangan" style="width: 300px; height: 300px; object-fit: cover; border-radius: 8px; display: block;">
  </div>

</div>
  <!-- Wadah Foto Interaktif (Keluar Satu Persatu) -->
  <div id="photo-display-container" style="display: none; justify-content: center; align-items: center;">
    <div id="photo-card-wrapper" style="background: white; padding: 15px 15px 40px 15px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.25); transform: scale(0.5); opacity: 0; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; display: inline-block;" onclick="nextPhotoStep()">
      <img id="current-memory-photo" src="" alt="Kenangan" style="width: 250px; height: 250px; object-fit: cover; border-radius: 8px; display: block;">
    </div>

  <!-- Wadah Foto Interaktif Tanpa Teks -->
  <div id="photo-display-container" style="display: none; justify-content: center; align-items: center;">
    <div id="photo-card-wrapper" style="background: white; padding: 12px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transform: scale(0.5); opacity: 0; transition: all 0.4s ease; cursor: pointer; display: inline-block;" onclick="nextPhotoStep()">
      <img id="current-memory-photo" src="" alt="Kenangan" style="width: 240px; height: 240px; object-fit: cover; border-radius: 10px; display: block;">
    </div>
  </div>

</div>
    <p id="tap" style="display: none;" class="animate__animated animate__pulse text-muted animate__slow animate__repeat-3">Ketuk untuk melanjutkan</p>
    <!-- Footer -->
    <footer class="page-footer font-small blue fixed-bottom">
  <!-- Optional JavaScript -->
  <!-- jQuery first, then Popper.js, then Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
    integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous">
  </script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous">
  </script>
  <script src="https://kit.fontawesome.com/61e5120832.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/typeit@7.0.4/dist/typeit.min.js"></script>
  <script src="https://momentjs.com/downloads/moment.js"></script>
  <script src="https://momentjs.com/downloads/moment-with-locales.js"></script>
  <script src="https://momentjs.com/downloads/moment-timezone-with-data.js"></script>
  <script src="script.js"></script>
</body>

</html>
